name: Build ARIA Android

on:
  push:
    branches:
      - main
      - aria-alpha-0.2-local-ai
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ARIA
        uses: actions/checkout@v4

      - name: Fetch pinned llama.cpp
        if: github.ref_name == 'aria-alpha-0.2-local-ai'
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/ggml-org/llama.cpp.git llama.cpp
          git -C llama.cpp checkout 26394b4e6749a41c3633db040e0987500a5f7013
          cp llama.cpp/examples/llama.android/gradle/libs.versions.toml gradle/libs.versions.toml

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --console=plain

      - name: Upload ARIA APK
        uses: actions/upload-artifact@v4
        with:
          name: ARIA-Mobile-Alpha
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
