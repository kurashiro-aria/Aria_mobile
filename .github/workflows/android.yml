name: Build ARIA Android
run-name: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'full' || github.event_name == 'push' && (github.ref_name == 'aria-alpha-0.2-local-ai' || github.ref_name == 'aria-cloud-brain-prototype') && contains(github.event.head_commit.message, '[build-apk]') && !contains(github.event.head_commit.message, '[tests-only]')) && 'TESTS + APK' || 'TESTS ONLY' }} · ${{ github.ref_name }}

on:
  push:
    branches:
      - main
      - aria-alpha-0.2-local-ai
      - voice-b2-experiment
      - aria-cloud-brain-prototype
  workflow_dispatch:
    inputs:
      mode:
        description: 'Choose tests only or tests and a signed APK'
        type: choice
        options:
          - full
          - tests-only
        default: full
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ARIA_BUILD_APK: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'full' || github.event_name == 'push' && (github.ref_name == 'aria-alpha-0.2-local-ai' || github.ref_name == 'aria-cloud-brain-prototype') && contains(github.event.head_commit.message, '[build-apk]') && !contains(github.event.head_commit.message, '[tests-only]') }}

    steps:
      - name: Checkout ARIA
        uses: actions/checkout@v4

      - name: Fetch pinned llama.cpp
        if: github.ref_name == 'aria-alpha-0.2-local-ai' || github.ref_name == 'voice-b2-experiment' || github.ref_name == 'aria-cloud-brain-prototype'
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/ggml-org/llama.cpp.git llama.cpp
          git -C llama.cpp checkout 26394b4e6749a41c3633db040e0987500a5f7013
          mkdir -p gradle
          cp llama.cpp/examples/llama.android/gradle/libs.versions.toml gradle/libs.versions.toml
          sed -i 's/alias(libs.plugins.android.library)/id("com.android.library")/' llama.cpp/examples/llama.android/lib/build.gradle.kts
          sed -i 's/alias(libs.plugins.jetbrains.kotlin.android)/id("org.jetbrains.kotlin.android")/' llama.cpp/examples/llama.android/lib/build.gradle.kts
          sed -i 's/compileSdk = 36/compileSdk = 35/' llama.cpp/examples/llama.android/lib/build.gradle.kts
          sed -i 's/minSdk = 33/minSdk = 33/' llama.cpp/examples/llama.android/lib/build.gradle.kts
          sed -i 's/libs.androidx.core.ktx/"androidx.core:core-ktx:1.15.0"/' llama.cpp/examples/llama.android/lib/build.gradle.kts
          git -C llama.cpp apply --check ../patches/llama-android.patch
          git -C llama.cpp apply ../patches/llama-android.patch
          git -C llama.cpp apply --check ../patches/aria-turn-reset.patch
          git -C llama.cpp apply ../patches/aria-turn-reset.patch
          git -C llama.cpp apply --check ../patches/aria-model-load-progress.patch
          git -C llama.cpp apply ../patches/aria-model-load-progress.patch

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: Install native Android toolchain
        run: ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Prepare pinned Pocket TTS native runtime
        run: bash scripts/prepare_pocket_native_deps.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Test chat response filtering
        run: gradle :app:testDebugUnitTest --stacktrace --console=plain

      - name: Summarize unit tests
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          files = glob.glob('app/build/test-results/testDebugUnitTest/TEST-*.xml')
          assert files, 'Missing JUnit XML results'
          suites = [ET.parse(path).getroot() for path in files]
          total = sum(int(s.get('tests', '0')) for s in suites)
          failed = sum(int(s.get('failures', '0')) + int(s.get('errors', '0')) for s in suites)
          print(f'ARIA unit tests: {total} completed, {failed} failed')
          assert total >= 58 and failed == 0
          PY

      - name: Restore existing ARIA signing key
        if: env.ARIA_BUILD_APK == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: aria-mobile-alpha-debug-signing-v1

      - name: Prepare verified signing key
        if: env.ARIA_BUILD_APK == 'true'
        env:
          ARIA_DEBUG_KEYSTORE_BASE64: ${{ secrets.ARIA_DEBUG_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          signing_path="$RUNNER_TEMP/aria-signing.keystore"
          if [ -n "$ARIA_DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$ARIA_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$signing_path"
          elif [ -f "$HOME/.android/debug.keystore" ]; then
            cp "$HOME/.android/debug.keystore" "$signing_path"
          else
            echo "::error::Existing signing key missing. Restore ARIA_DEBUG_KEYSTORE_BASE64; do not generate a new key."
            exit 1
          fi
          chmod 600 "$signing_path"
          expected="2321B43077CD25D11D9D78312E9EDB920441FD4847B406DD6E30774815E59921"
          actual="$(keytool -J-Duser.language=en -list -v -keystore "$signing_path" -storepass android -alias androiddebugkey | sed -n 's/^[[:space:]]*SHA256: //p' | tr -d ':')"
          test "$actual" = "$expected" || { echo "::error::Signing key fingerprint mismatch"; exit 1; }
          echo "ARIA_SIGNING_KEYSTORE=$signing_path" >> "$GITHUB_ENV"
          echo "ARIA signing SHA256: $actual"

      - name: Build debug APK
        if: env.ARIA_BUILD_APK == 'true'
        env:
          ORG_GRADLE_PROJECT_ARIA_CLOUD_ENDPOINT: https://aria-cloud-gateway.eduardo-rojas-a96.workers.dev
          ORG_GRADLE_PROJECT_ARIA_CLOUD_CLIENT_TOKEN: ${{ secrets.ARIA_CLOUD_CLIENT_TOKEN }}
        run: gradle :app:assembleDebug --stacktrace --console=plain

      - name: Verify final APK certificate and version
        if: env.ARIA_BUILD_APK == 'true'
        shell: bash
        run: bash scripts/verify-apk.sh

      - name: Name versioned APK
        if: env.ARIA_BUILD_APK == 'true'
        id: apk-name
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -c 'import json; print(json.load(open("app/build/outputs/apk/debug/output-metadata.json"))["elements"][0]["versionName"])')"
          short_sha="${GITHUB_SHA::7}"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/ARIA-Mobile-${version}-${short_sha}.apk"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"

      - name: Upload ARIA APK
        if: env.ARIA_BUILD_APK == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ARIA-Mobile-${{ steps.apk-name.outputs.version }}-${{ steps.apk-name.outputs.short_sha }}
          path: dist/ARIA-Mobile-*.apk
          if-no-files-found: error
