name: Build ARIA Android

on:
  push:
    branches:
      - main
      - aria-alpha-0.2-local-ai
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ARIA
        uses: actions/checkout@v4

      - name: Fetch pinned llama.cpp
        if: github.ref_name == 'aria-alpha-0.2-local-ai'
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/ggml-org/llama.cpp.git llama.cpp
          git -C llama.cpp checkout 26394b4e6749a41c3633db040e0987500a5f7013
          mkdir -p gradle
          cp llama.cpp/examples/llama.android/gradle/libs.versions.toml gradle/libs.versions.toml
          sed -i 's/alias(libs.plugins.android.library)/id("com.android.library")/' llama.cpp/examples/llama.android/lib/build.gradle.kts
          sed -i 's/alias(libs.plugins.jetbrains.kotlin.android)/id("org.jetbrains.kotlin.android")/' llama.cpp/examples/llama.android/lib/build.gradle.kts
          sed -i 's/compileSdk = 36/compileSdk = 35/' llama.cpp/examples/llama.android/lib/build.gradle.kts
          sed -i 's/minSdk = 33/minSdk = 33/' llama.cpp/examples/llama.android/lib/build.gradle.kts
          sed -i 's/libs.androidx.core.ktx/"androidx.core:core-ktx:1.15.0"/' llama.cpp/examples/llama.android/lib/build.gradle.kts
          python3 - <<'PY'
          from pathlib import Path

          p = Path("llama.cpp/examples/llama.android/lib/src/main/cpp/ai_chat.cpp")
          s = p.read_text()
          s = s.replace("#include <string>\n", "#include <string>\n#include <mutex>\n")
          marker = "static llama_model                      * g_model;\n"
          diag = r'''static std::mutex                       g_diag_mutex;
static std::string                      g_last_native_log;

static void aichat_diagnostic_log_callback(enum ggml_log_level level, const char * text, void * /*user_data*/) {
    aichat_android_log_callback(level, text, nullptr);
    if (!text) return;
    std::lock_guard<std::mutex> lock(g_diag_mutex);
    g_last_native_log += text;
    constexpr size_t MAX_DIAG_CHARS = 12000;
    if (g_last_native_log.size() > MAX_DIAG_CHARS) {
        g_last_native_log.erase(0, g_last_native_log.size() - MAX_DIAG_CHARS);
    }
}

static void clear_last_native_log() {
    std::lock_guard<std::mutex> lock(g_diag_mutex);
    g_last_native_log.clear();
}

'''
          if marker not in s:
              raise SystemExit("ai_chat.cpp marker not found")
          s = s.replace(marker, diag + marker, 1)
          s = s.replace("llama_log_set(aichat_android_log_callback, nullptr);",
                        "llama_log_set(aichat_diagnostic_log_callback, nullptr);", 1)
          load_marker = "    llama_model_params model_params = llama_model_default_params();\n"
          s = s.replace(load_marker, load_marker + "    clear_last_native_log();\n", 1)
          system_marker = 'extern "C"\nJNIEXPORT jstring JNICALL\nJava_com_arm_aichat_internal_InferenceEngineImpl_systemInfo'
          diagnostic_fn = r'''extern "C"
JNIEXPORT jstring JNICALL
Java_com_arm_aichat_internal_InferenceEngineImpl_lastNativeLog(JNIEnv *env, jobject /*unused*/) {
    std::lock_guard<std::mutex> lock(g_diag_mutex);
    return env->NewStringUTF(g_last_native_log.c_str());
}

'''
          if system_marker not in s:
              raise SystemExit("systemInfo marker not found")
          s = s.replace(system_marker, diagnostic_fn + system_marker, 1)
          p.write_text(s)

          k = Path("llama.cpp/examples/llama.android/lib/src/main/java/com/arm/aichat/internal/InferenceEngineImpl.kt")
          s = k.read_text()
          native_marker = "    private external fun systemInfo(): String\n"
          s = s.replace(native_marker, "    private external fun lastNativeLog(): String\n\n" + native_marker, 1)
          old = """                load(pathToModel).let {
                    // TODO-han.yin: find a better way to pass other error codes
                    if (it != 0) throw UnsupportedArchitectureException()
                }
"""
          new = """                load(pathToModel).let {
                    if (it != 0) {
                        val nativeDetail = lastNativeLog().trim().takeLast(6000)
                        throw IOException(
                            "llama_model_load_from_file falló (código $it). Log nativo:\\n" +
                                nativeDetail.ifBlank { "(sin log nativo capturado)" }
                        )
                    }
                }
"""
          if old not in s:
              raise SystemExit("InferenceEngineImpl load block not found")
          s = s.replace(old, new, 1)
          k.write_text(s)
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: Install native Android toolchain
        run: ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "ndk;29.0.13113456" "cmake;3.31.6"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --console=plain

      - name: Upload ARIA APK
        uses: actions/upload-artifact@v4
        with:
          name: ARIA-Mobile-Alpha
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
