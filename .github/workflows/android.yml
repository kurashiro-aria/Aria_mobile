name: Build ARIA Android

on:
  push:
    branches:
      - main
      - aria-alpha-0.2-local-ai
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ARIA
        uses: actions/checkout@v4

      - name: Fetch pinned llama.cpp
        if: github.ref_name == 'aria-alpha-0.2-local-ai'
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/ggml-org/llama.cpp.git llama.cpp
          git -C llama.cpp checkout 26394b4e6749a41c3633db040e0987500a5f7013
          mkdir -p gradle
          cp llama.cpp/examples/llama.android/gradle/libs.versions.toml gradle/libs.versions.toml
          sed -i 's/alias(libs.plugins.android.library)/id("com.android.library")/' llama.cpp/examples/llama.android/lib/build.gradle.kts
          sed -i 's/alias(libs.plugins.jetbrains.kotlin.android)/id("org.jetbrains.kotlin.android")/' llama.cpp/examples/llama.android/lib/build.gradle.kts
          sed -i 's/compileSdk = 36/compileSdk = 35/' llama.cpp/examples/llama.android/lib/build.gradle.kts
          sed -i 's/minSdk = 33/minSdk = 33/' llama.cpp/examples/llama.android/lib/build.gradle.kts
          sed -i 's/libs.androidx.core.ktx/"androidx.core:core-ktx:1.15.0"/' llama.cpp/examples/llama.android/lib/build.gradle.kts
          git -C llama.cpp apply --check ../patches/llama-android.patch
          git -C llama.cpp apply ../patches/llama-android.patch

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore existing ARIA signing key
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: aria-mobile-alpha-debug-signing-v1

      - name: Prepare verified signing key
        env:
          ARIA_DEBUG_KEYSTORE_BASE64: ${{ secrets.ARIA_DEBUG_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          signing_path="$RUNNER_TEMP/aria-signing.keystore"
          if [ -n "$ARIA_DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$ARIA_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$signing_path"
          elif [ -f "$HOME/.android/debug.keystore" ]; then
            cp "$HOME/.android/debug.keystore" "$signing_path"
          else
            echo "::error::Existing signing key missing. Restore ARIA_DEBUG_KEYSTORE_BASE64; do not generate a new key."
            exit 1
          fi
          chmod 600 "$signing_path"
          expected="24A83E6CAE643A11B30E1102166EC4F8B4CECDD4614F7BA5A1E7CBEBC16CDE17"
          actual="$(keytool -J-Duser.language=en -list -v -keystore "$signing_path" -storepass android -alias androiddebugkey | sed -n 's/^[[:space:]]*SHA256: //p' | tr -d ':')"
          test "$actual" = "$expected" || { echo "::error::Signing key fingerprint mismatch"; exit 1; }
          echo "ARIA_SIGNING_KEYSTORE=$signing_path" >> "$GITHUB_ENV"
          echo "ARIA signing SHA256: $actual"

      - name: Accept Android SDK licenses
        run: yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: Install native Android toolchain
        run: ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "ndk;29.0.13113456" "cmake;3.31.6"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Test chat response filtering
        run: gradle :app:testDebugUnitTest --stacktrace --console=plain

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --console=plain

      - name: Verify final APK certificate and version
        shell: bash
        run: bash scripts/verify-apk.sh

      - name: Upload ARIA APK
        uses: actions/upload-artifact@v4
        with:
          name: ARIA-Mobile-Alpha
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
