name: ARIA Portrait Safe Spacing
on:
  push:
    branches: [aria-alpha-0.2-local-ai]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aria-alpha-0.2-local-ai
      - name: Add safe initial chat spacing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/kura/aria/MainActivity.kt')
          s = p.read_text()
          old = 'conversation = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(0, dp(10), 0, dp(10)) }'
          new = 'conversation = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(0, dp(218), 0, dp(10)) }'
          if new in s:
              print('Safe spacing already applied')
          elif old in s:
              p.write_text(s.replace(old, new, 1))
          else:
              raise SystemExit('conversation padding target not found')
          PY
      - name: Verify and commit
        run: |
          set -e
          grep -q 'setPadding(0, dp(218), 0, dp(10))' app/src/main/java/com/kura/aria/MainActivity.kt
          grep -q 'val chatStage = FrameLayout(this)' app/src/main/java/com/kura/aria/MainActivity.kt
          git diff --check
          if git diff --quiet; then
            echo 'No changes required'
            exit 0
          fi
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add app/src/main/java/com/kura/aria/MainActivity.kt
          git commit -m 'Keep first chat messages clear of ARIA portrait'
          git push
