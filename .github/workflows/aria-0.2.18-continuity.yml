name: Apply ARIA floating portrait patch

on:
  push:
    branches:
      - aria-alpha-0.2-local-ai

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aria-alpha-0.2-local-ai
          fetch-depth: 0

      - name: Apply floating portrait layout
        shell: python
        run: |
          from pathlib import Path

          p = Path("app/src/main/java/com/kura/aria/MainActivity.kt")
          s = p.read_text()

          old = '''        // Give the expression its own space above the conversation.
        root.addView(avatarCard, LinearLayout.LayoutParams(dp(150), dp(200)).apply {
            marginStart = dp(4); topMargin = dp(8)
        })

        conversation = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(0, dp(10), 0, dp(10)) }
        scroll = ScrollView(this).apply { addView(conversation); isFillViewport = true }
        root.addView(scroll, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f).apply { topMargin = dp(8) })
'''

          new = '''        conversation = LinearLayout(this).apply {
            orientation = LinearLayout.VERTICAL
            setPadding(0, dp(10), 0, dp(10))
        }
        scroll = ScrollView(this).apply {
            addView(conversation)
            isFillViewport = true
        }

        // ARIA floats over the conversation instead of reserving a full row.
        val chatStage = FrameLayout(this).apply {
            addView(scroll, FrameLayout.LayoutParams(
                FrameLayout.LayoutParams.MATCH_PARENT,
                FrameLayout.LayoutParams.MATCH_PARENT
            ))
            addView(avatarCard, FrameLayout.LayoutParams(dp(150), dp(200), Gravity.TOP or Gravity.START).apply {
                marginStart = dp(4)
                topMargin = dp(8)
            })
        }
        avatarCard.elevation = dp(10).toFloat()
        root.addView(chatStage, LinearLayout.LayoutParams(
            LinearLayout.LayoutParams.MATCH_PARENT,
            0,
            1f
        ).apply { topMargin = dp(8) })
'''

          if old not in s:
              if "val chatStage = FrameLayout(this)" in s:
                  print("Floating portrait already applied")
              else:
                  raise SystemExit("Expected portrait layout block was not found")
          else:
              p.write_text(s.replace(old, new, 1))

      - name: Verify layout patch
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'val chatStage = FrameLayout(this)' app/src/main/java/com/kura/aria/MainActivity.kt
          grep -q 'addView(avatarCard, FrameLayout.LayoutParams' app/src/main/java/com/kura/aria/MainActivity.kt
          if grep -q 'root.addView(avatarCard, LinearLayout.LayoutParams' app/src/main/java/com/kura/aria/MainActivity.kt; then
            echo 'Old non-floating portrait layout is still present'
            exit 1
          fi
          git diff --check

      - name: Commit layout patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No changes required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/kura/aria/MainActivity.kt
          git commit -m 'Float ARIA portrait over conversation'
          git push origin HEAD:aria-alpha-0.2-local-ai
