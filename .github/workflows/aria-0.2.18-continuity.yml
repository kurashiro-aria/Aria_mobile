name: ARIA Continuity Patch
on:
  push:
    branches:
      - aria-alpha-0.2-local-ai
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aria-alpha-0.2-local-ai
      - name: Apply patch
        run: python3 .github/scripts/aria_continuity_patch.py
      - name: Verify
        run: |
          grep -q 'private fun maybeStartConversation()' app/src/main/java/com/kura/aria/MainActivity.kt
          grep -q 'setPadding(0, dp(218), 0, dp(10))' app/src/main/java/com/kura/aria/MainActivity.kt
          git diff --check
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add app/src/main/java/com/kura/aria/MainActivity.kt
          git commit -m 'Add conversational continuity and ARIA initiative'
          git push
