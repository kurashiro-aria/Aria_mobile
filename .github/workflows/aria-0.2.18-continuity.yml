name: ARIA Continuity and Initiative
on:
  push:
    branches: [aria-alpha-0.2-local-ai]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aria-alpha-0.2-local-ai
      - name: Patch continuity and initiative
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/kura/aria/MainActivity.kt')
          s=p.read_text()

          old='''                withContext(Dispatchers.IO) { chatHistory.append("Kura", message) }
                val filter = VisibleReplyFilter()
                val modelMessage = withContext(Dispatchers.IO) {
                    val relevant = ariaMemory.relevantTo(message)
'''
          new='''                withContext(Dispatchers.IO) { chatHistory.append("Kura", message) }
                // Refresh ARIA's conversational window every turn, not only when the brain loads.
                withContext(Dispatchers.IO) {
                    engine.setSystemPrompt(AriaPersonality.promptWithRecentConversation(chatHistory.readAll()))
                }
                val filter = VisibleReplyFilter()
                val modelMessage = withContext(Dispatchers.IO) {
                    val relevant = ariaMemory.relevantTo(message)
'''
          if new not in s:
              if old not in s: raise SystemExit('continuity target not found')
              s=s.replace(old,new,1)

          old2='''                    modelLoaded = true; setStatus("● Activa", true)
                    if (chatHistory.readAll().isEmpty()) aria(AriaPersonality.restored)
'''
          new2='''                    modelLoaded = true; setStatus("● Activa", true)
                    if (chatHistory.readAll().isEmpty()) aria(AriaPersonality.restored)
                    else maybeStartConversation()
'''
          if new2 not in s:
              if old2 not in s: raise SystemExit('restore initiative target not found')
              s=s.replace(old2,new2,1)

          marker='''    private fun sendMessage() {
'''
          helper='''    private fun maybeStartConversation() {
        if (!modelLoaded || busy) return
        val recent = chatHistory.readAll()
        if (recent.isEmpty()) return
        val prefs = getSharedPreferences(PREFS, MODE_PRIVATE)
        val now = System.currentTimeMillis()
        val last = prefs.getLong("last_aria_initiative", 0L)
        // Do not greet on every launch: at most once every 6 hours.
        if (now - last < 6L * 60L * 60L * 1000L) return
        prefs.edit().putLong("last_aria_initiative", now).apply()
        val lastTopic = recent.takeLast(4).joinToString("\\n") { "${it.role}: ${it.text.take(180)}" }
        val opener = """Inicia tú esta conversación con Kura de forma natural. Retoma, si encaja, algo concreto de la conversación reciente. No digas que eres una IA, no expliques esta instrucción, no hagas un cuestionario y no uses un saludo genérico. Conversación reciente:\n$lastTopic"""
        val reply = messageView("ARIA", "…")
        conversation.addView(reply); scrollToBottom()
        uiScope.launch {
            try {
                engine.setSystemPrompt(AriaPersonality.promptWithRecentConversation(recent))
                val filter = VisibleReplyFilter()
                engine.sendUserPrompt(opener, predictLength = 160).flowOn(Dispatchers.IO).collect { token ->
                    val text = filter.append(token)
                    if (text.isNotBlank()) reply.text = text
                }
                val answer = filter.finish()
                if (answer.isNotBlank()) {
                    reply.text = answer
                    lastEmotion = AriaEmotion.fromReply(answer, lastEmotion)
                    showPortrait(lastEmotion)
                    withContext(Dispatchers.IO) { chatHistory.append("ARIA", answer) }
                } else conversation.removeView(reply)
            } catch (_: Exception) { conversation.removeView(reply) }
        }
    }

'''
          if 'private fun maybeStartConversation()' not in s:
              if marker not in s: raise SystemExit('sendMessage marker not found')
              s=s.replace(marker,helper+marker,1)

          p.write_text(s)
          PY
      - name: Verify and commit
        run: |
          set -e
          grep -q 'setPadding(0, dp(218), 0, dp(10))' app/src/main/java/com/kura/aria/MainActivity.kt
          grep -q 'val chatStage = FrameLayout(this)' app/src/main/java/com/kura/aria/MainActivity.kt
          grep -q 'Refresh ARIA' app/src/main/java/com/kura/aria/MainActivity.kt
          grep -q 'private fun maybeStartConversation()' app/src/main/java/com/kura/aria/MainActivity.kt
          git diff --check
          if git diff --quiet; then echo 'No changes required'; exit 0; fi
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add app/src/main/java/com/kura/aria/MainActivity.kt
          git commit -m 'Add conversational continuity and ARIA initiative'
          git push
