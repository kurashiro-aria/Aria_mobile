name: ARIA Cloud Gateway
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the Worker after tests
        type: boolean
        default: false
        required: true
jobs:
  gateway:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require Cloud prototype branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "aria-cloud-brain-prototype" || {
            echo "::error::This workflow may deploy only aria-cloud-brain-prototype (got $GITHUB_REF_NAME)"
            exit 1
          }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test ARIA Cloud Gateway
        working-directory: backend-worker
        run: npm test
      - name: Deploy ARIA Cloud Gateway
        if: inputs.deploy
        working-directory: backend-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ARIA_CLOUD_CLIENT_TOKEN: ${{ secrets.ARIA_CLOUD_CLIENT_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$ARIA_CLOUD_CLIENT_TOKEN"
          printf '%s' "$ARIA_CLOUD_CLIENT_TOKEN" | npx --yes wrangler secret put ARIA_CLOUD_CLIENT_TOKEN
          npx --yes wrangler deploy
      - name: Verify real Cloud Voice audio
        if: inputs.deploy
        env:
          ARIA_CLOUD_CLIENT_TOKEN: ${{ secrets.ARIA_CLOUD_CLIENT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ARIA_CLOUD_CLIENT_TOKEN"
          request_id="voice-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          curl --fail-with-body --silent --show-error --max-time 60 \
            -X POST "https://aria-cloud-gateway.eduardo-rojas-a96.workers.dev/v1/voice/synthesize" \
            -H "Content-Type: application/json" \
            -H "X-ARIA-Protocol: 1" \
            -H "X-ARIA-Client: $ARIA_CLOUD_CLIENT_TOKEN" \
            --data "{\"requestId\":\"$request_id\",\"text\":\"Hola Kura. Esta es una prueba segura de ARIA Cloud.\",\"emotion\":\"neutral\",\"intensity\":0.2,\"expressionStyle\":\"natural\",\"voiceId\":\"Leda\"}" \
            --output /tmp/aria-cloud-voice.wav
          python3 - <<'PY'
          from pathlib import Path
          audio = Path('/tmp/aria-cloud-voice.wav').read_bytes()
          assert len(audio) > 44, 'Cloud TTS returned empty audio'
          assert audio[:4] == b'RIFF' and audio[8:12] == b'WAVE', 'Cloud TTS did not return WAV'
          print(f'Cloud Voice real audio verified: {len(audio)} bytes')
          PY
          rm -f /tmp/aria-cloud-voice.wav
